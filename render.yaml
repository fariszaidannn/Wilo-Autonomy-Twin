# Render Blueprint: New > Blueprint > pick this repo, or use the Deploy to Render link in README.
# Builds from the repo root (no rootDir) so the frontend/ folder the backend serves is included.
services:
  - type: web
    name: water-autonomy-twin
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-render.txt && cd backend && python prewarm.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Fewer glibc malloc arenas keeps the threaded app's memory well under the 512 MB plan limit.
      - key: MALLOC_ARENA_MAX
        value: "2"
